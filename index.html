<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="weather-card">
        <h1 class="app-title">🌤️ Weather App</h1>
        
        <!-- Search Bar with City & Country Options -->
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city (e.g. Mumbai)" autocomplete="off">
            <input type="text" id="countryInput" placeholder="Country (optional e.g. India)" autocomplete="off">
            <button id="searchBtn">Search</button>
        </div>

        <!-- Weather Display Info -->
        <div id="weatherInfo" class="weather-info hidden">
            <h2 id="cityName">Delhi, India</h2>
            <div class="temp-display">
                <span id="temperature">28</span>°C
            </div>
            <p id="weatherCondition" class="condition">Clear Sky</p>

            <div class="details-grid">
                <div class="detail-item">
                    <span class="label">Wind Speed</span>
                    <span id="windSpeed" class="value">12 km/h</span>
                </div>
                <div class="detail-item">
                    <span class="label">Latitude</span>
                    <span id="latitude" class="value">28.61</span>
                </div>
                <div class="detail-item">
                    <span class="label">Longitude</span>
                    <span id="longitude" class="value">77.20</span>
                </div>
            </div>
        </div>

        <!-- Loading & Error Messages -->
        <div id="message" class="message">Search for a city to see live weather!</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
